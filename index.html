<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Living Studio Creative Coding 2.0 — an interactive webcam artwork using Teachable Machine, ml5.js and p5.js.">
  <title>Living Studio · Creative Coding 2.0</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <style>
    :root { color-scheme: dark; --ink:#f7f2e8; --muted:rgba(247,242,232,.7); --panel:rgba(10,12,18,.68); --line:rgba(255,255,255,.16); --accent:#ffd166; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#0e1018; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    canvas { position:fixed; inset:0; display:block; z-index:0; }
    .topbar { position:fixed; z-index:5; top:0; left:0; right:0; display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:22px 26px; pointer-events:none; }
    .brand,.status { padding:12px 15px; border:1px solid var(--line); border-radius:14px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:0 10px 40px rgba(0,0,0,.22); }
    .eyebrow { margin:0 0 4px; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:clamp(22px,3vw,38px); font-weight:500; line-height:1; }
    .status { max-width:min(430px,48vw); color:var(--ink); font-size:13px; line-height:1.45; text-align:right; }
    .intro { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 25% 20%,rgba(255,119,64,.26),transparent 35%),radial-gradient(circle at 80% 75%,rgba(55,186,219,.24),transparent 40%),#0e1018; transition:opacity 500ms ease,visibility 500ms ease; }
    .intro.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .intro-card { width:min(680px,100%); padding:clamp(28px,6vw,58px); border:1px solid var(--line); border-radius:28px; background:rgba(15,17,25,.76); backdrop-filter:blur(22px); box-shadow:0 30px 100px rgba(0,0,0,.38); }
    .intro-card h2 { margin:10px 0 18px; color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:clamp(34px,7vw,68px); font-weight:500; line-height:.98; }
    .intro-card p { margin:0 0 24px; color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.65; }
    .legend { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px; }
    .legend span { padding:7px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink); font-size:12px; }
    button { appearance:none; border:0; border-radius:999px; padding:14px 22px; background:var(--accent); color:#17130a; font:inherit; font-weight:800; cursor:pointer; transition:transform 160ms ease,filter 160ms ease; }
    button:hover { transform:translateY(-2px); filter:brightness(1.06); }
    button:focus-visible { outline:3px solid white; outline-offset:4px; }
    .privacy { display:inline-block; margin-left:12px; color:var(--muted); font-size:12px; }
    .footer-note { position:fixed; z-index:5; left:26px; bottom:20px; color:rgba(255,255,255,.58); font-size:11px; letter-spacing:.04em; pointer-events:none; }
    @media (max-width:680px) { .topbar{padding:14px;flex-direction:column;gap:8px}.status{max-width:100%;text-align:left}.footer-note{left:14px;bottom:12px}.privacy{display:block;margin:12px 0 0} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><p class="eyebrow">Living Studio</p><h1>Creative Coding 2.0</h1></div>
    <div id="status" class="status" role="status" aria-live="polite">等待启动互动体验</div>
  </header>
  <section id="intro" class="intro">
    <div class="intro-card">
      <p class="eyebrow">Webcam · Teachable Machine · ml5.js</p>
      <h2>让身体成为画笔</h2>
      <p>允许摄像头后，作品会根据实时图像识别结果，在火热夏日、蓝色椰林和阅读空间之间切换。图像只在你的浏览器中处理。</p>
      <div class="legend" aria-label="三个识别主题"><span>Class 1 · Summer</span><span>Class 2 · Coconut</span><span>Class 3 · Reader</span></div>
      <button id="startButton" type="button">启动摄像头体验</button><span class="privacy">需要摄像头权限</span>
    </div>
  </section>
  <div class="footer-note">An interactive net-art study by Haru Aki · 2026</div>
  <script src="sketch.js"></script>
</body>
</html>
